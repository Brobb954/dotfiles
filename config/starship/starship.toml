"$schema" = 'https://starship.rs/config-schema.json'

format = """
[  ](bg:transparent fg:)\
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$rust\
$golang\
$php\
$cmd_duration\
\n$character"""

[cmd_duration]
min_time = 200
style = "fg: #a0a9cb"
format = "[ $duration ]($style)"

[directory]
style = "fg:#e3e5e5 bg:transparent"
format = "[ $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[fill]
symbol = " "

[git_branch]
symbol = ""
style = "bg:transparent"
format = '[[ $symbol $branch ](fg:#769ff0 bg:transparent)]($style)'

[git_status]
style = "bg:transparent"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:transparent)]($style)'

[nodejs]
symbol = ""
style = "bg:transparent"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:transparent)]($style)'

[rust]
symbol = ""
style = "bg:transparent"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:transparent)]($style)'

[golang]
symbol = ""
style = "bg:transparent"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:transparent)]($style)'

[php]
symbol = ""
style = "bg:transparent"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:transparent)]($style)'

[time]
disabled = true
time_format = "%R"                                          # Hour:Minute Format
style = "bg:transparent"
format = '[[  $time ](fg:#a0a9cb bg:transparent)]($style)'
